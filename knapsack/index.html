<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Knapsack</title>
<style>
  :root{
    --bg:#fbfaf9;
    --surface:#ffffff;
    --ink:#141414;
    --muted:#8c8781;
    --line:#e6e2de;
    --line-strong:#cfc9c3;
    --accent:#c4738d;      /* single restrained accent */
    --accent-soft:#f6ebef;
    --warn:#a8523f;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Inter","Helvetica Neue",Arial,sans-serif;
    font-size:15px;
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
    font-variant-numeric:tabular-nums;
  }
  .wrap{max-width:960px;margin:0 auto;padding:56px 28px 40px}

  /* ---------- header ---------- */
  header{
    display:flex;align-items:flex-end;justify-content:space-between;
    gap:24px;flex-wrap:wrap;
    padding-bottom:20px;border-bottom:1px solid var(--line);
  }
  h1{
    margin:0;font-size:22px;font-weight:500;letter-spacing:-.02em;
  }
  .sub{margin:2px 0 0;font-size:12px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
  .stats{display:flex;gap:28px}
  .stat{text-align:right}
  .stat b{display:block;font-size:19px;font-weight:500;letter-spacing:-.02em}
  .stat span{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}

  /* ---------- layout ---------- */
  .board{display:grid;grid-template-columns:1fr 288px;gap:48px;margin-top:36px;align-items:start}
  @media(max-width:800px){.board{grid-template-columns:1fr;gap:36px}}

  .eyebrow{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin:0 0 6px}
  h2{margin:0 0 4px;font-size:17px;font-weight:500;letter-spacing:-.01em}
  .blurb{margin:0 0 22px;font-size:13.5px;color:var(--muted);max-width:52ch}

  /* ---------- items ---------- */
  .items{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:1px;background:var(--line);border:1px solid var(--line)}
  .item{
    background:var(--surface);
    padding:16px 14px;
    cursor:pointer;
    display:flex;flex-direction:column;gap:10px;
    transition:background .15s ease,color .15s ease;
    user-select:none;position:relative;
  }
  .item:hover{background:#faf8f7}
  .item.picked{background:var(--accent-soft)}
  .item.picked .dot{background:var(--accent);border-color:var(--accent)}
  .top{display:flex;align-items:center;justify-content:space-between}
  .emoji{font-size:20px;line-height:1;filter:grayscale(.15)}
  .dot{width:11px;height:11px;border-radius:50%;border:1px solid var(--line-strong);transition:background .15s,border-color .15s}
  .name{font-size:13.5px;letter-spacing:-.01em}
  .meta{display:flex;gap:12px;font-size:11px;color:var(--muted);letter-spacing:.02em}
  .meta em{font-style:normal;color:var(--ink)}

  /* ---------- side panel ---------- */
  .side{position:sticky;top:40px}
  .readout{display:flex;justify-content:space-between;align-items:baseline;font-size:13px}
  .readout .big{font-size:24px;font-weight:500;letter-spacing:-.02em}
  .readout .unit{font-size:11px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
  .track{height:2px;background:var(--line);margin:14px 0 6px;position:relative}
  .fill{height:100%;width:0;background:var(--ink);transition:width .3s cubic-bezier(.4,0,.2,1)}
  .fill.over{background:var(--warn)}
  .note{font-size:11.5px;color:var(--muted);height:1.4em;letter-spacing:.01em}
  .note.warn{color:var(--warn)}

  .bag{border-top:1px solid var(--line);margin-top:20px;padding-top:14px;min-height:76px}
  .bag ul{list-style:none;margin:0;padding:0}
  .bag li{
    display:flex;justify-content:space-between;align-items:center;gap:10px;
    font-size:13px;padding:5px 0;cursor:pointer;color:var(--ink);
  }
  .bag li:hover{color:var(--accent)}
  .bag li span{color:var(--muted);font-size:11.5px}
  .bag li:hover span{color:var(--accent)}
  .empty{font-size:12.5px;color:var(--muted)}

  /* ---------- buttons ---------- */
  button{
    font-family:inherit;cursor:pointer;border:1px solid var(--ink);background:var(--ink);color:#fff;
    padding:11px 14px;font-size:11px;letter-spacing:.14em;text-transform:uppercase;
    transition:opacity .15s,background .15s,color .15s;
  }
  button:hover{opacity:.82}
  button:disabled{opacity:.28;cursor:not-allowed}
  .btn-main{width:100%;margin-top:22px}
  .btn-ghost{background:transparent;color:var(--ink);border-color:var(--line-strong)}
  .btn-ghost:hover{border-color:var(--ink);opacity:1}
  .row{display:flex;gap:8px;margin-top:8px}
  .row button{flex:1}

  .log{margin-top:26px;border-top:1px solid var(--line);padding-top:12px;font-size:11.5px;color:var(--muted);max-height:140px;overflow:auto}
  .log div{padding:4px 0}
  .log b{color:var(--ink);font-weight:500}

  /* ---------- modal ---------- */
  .veil{position:fixed;inset:0;background:rgba(20,20,20,.32);display:none;place-items:center;padding:24px;z-index:20;backdrop-filter:blur(2px)}
  .veil.on{display:grid}
  .card{
    background:var(--surface);border:1px solid var(--line);max-width:430px;width:100%;padding:32px;
    animation:fade .22s ease;
  }
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .card h3{margin:0;font-size:20px;font-weight:500;letter-spacing:-.02em}
  .rating{margin:14px 0 18px;font-size:14px;letter-spacing:.3em;color:var(--accent)}
  .rating i{color:var(--line-strong);font-style:normal}
  .card p{margin:0;font-size:13.5px;color:var(--muted);line-height:1.65}
  .card p b{color:var(--ink);font-weight:500}
  .sol{border-top:1px solid var(--line);margin-top:18px;padding-top:14px;font-size:12.5px;color:var(--muted);line-height:1.8}
  .sol .eyebrow{margin-bottom:8px}
  .sol b{color:var(--ink);font-weight:500}

  footer{margin-top:56px;padding-top:18px;border-top:1px solid var(--line);font-size:11px;color:var(--muted);letter-spacing:.02em}
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div>
      <h1>Knapsack</h1>
      <p class="sub">Pack the optimal bag</p>
    </div>
    <div class="stats">
      <div class="stat"><b id="s-level">1</b><span>Level</span></div>
      <div class="stat"><b id="s-score">0</b><span>Score</span></div>
      <div class="stat"><b id="s-stars">0</b><span>Stars</span></div>
      <div class="stat"><b id="s-streak">0</b><span>Streak</span></div>
    </div>
  </header>

  <div class="board">
    <section>
      <p class="eyebrow" id="level-no">Level 01</p>
      <h2 id="level-title">Picnic</h2>
      <p class="blurb" id="level-blurb"></p>
      <div class="items" id="items"></div>
    </section>

    <aside class="side">
      <p class="eyebrow">The bag</p>
      <div class="readout">
        <span><span class="big" id="w-read">0</span> <span class="unit" id="cap-read">/ 0 kg</span></span>
        <span><span class="big" id="v-read">0</span> <span class="unit">value</span></span>
      </div>
      <div class="track"><div class="fill" id="fill"></div></div>
      <div class="note" id="note"></div>

      <div class="bag" id="bag"></div>

      <button class="btn-main" id="go">Seal the bag</button>
      <div class="row">
        <button class="btn-ghost" id="clear">Clear</button>
        <button class="btn-ghost" id="hint">Hint &minus;20</button>
      </div>

      <div class="log" id="log"></div>
    </aside>
  </div>

  <footer>0/1 knapsack &middot; optimal solutions computed by dynamic programming</footer>
</div>

<div class="veil" id="veil">
  <div class="card">
    <h3 id="m-title">Result</h3>
    <div class="rating" id="m-stars"></div>
    <p id="m-line"></p>
    <div class="sol"><p class="eyebrow">Optimal bag</p><div id="m-sol"></div></div>
    <button class="btn-main" id="m-next">Next level</button>
  </div>
</div>

<script>
const LEVELS = [
  { name:"Picnic", blurb:"One basket, too many snacks. Pack the highest total value without exceeding the weight limit.",
    cap:10, items:[
    ["🍓","Strawberries",2,6],["🥪","Sandwich",4,10],["🍰","Cake",5,12],
    ["🧃","Juice",3,7],["🍪","Cookies",1,3],["🍇","Grapes",2,5]]},

  { name:"Overnight", blurb:"Packing for a single night away. Every extra kilo costs you.",
    cap:14, items:[
    ["🧸","Teddy",4,9],["💄","Makeup bag",3,8],["🎧","Headphones",2,9],
    ["📚","Novel",5,7],["🪞","Mirror",6,11],["🧦","Socks",1,4],
    ["🕯️","Candle",3,5]]},

  { name:"The Cave", blurb:"The cave is collapsing. Take the richest haul you can carry out.",
    cap:20, items:[
    ["💎","Diamond",6,25],["👑","Crown",9,32],["🪙","Gold coins",4,15],
    ["📿","Pearls",3,11],["🗝️","Old key",1,2],["🏺","Vase",7,18],
    ["🔮","Orb",5,17],["⚔️","Sword",8,20]]},

  { name:"Launch", blurb:"Fuel is weight, mission value is everything. Choose the payload.",
    cap:26, items:[
    ["🛰️","Satellite",11,40],["🔬","Microscope",5,19],["🌱","Seed vault",4,17],
    ["🔋","Battery",6,21],["📡","Antenna",7,26],["🧪","Samples",3,13],
    ["🤖","Rover",12,44],["☕","Coffee",2,9],["🪛","Toolkit",5,16]]},

  { name:"The Heist", blurb:"One bag, ten temptations. Only a perfect pack makes the getaway.",
    cap:32, items:[
    ["🖼️","Painting",13,48],["💍","Ring",2,14],["🏆","Trophy",8,27],
    ["📀","Master tape",4,18],["🧿","Amulet",5,22],["💰","Cash bundle",9,31],
    ["🎻","Violin",7,24],["🪩","Disco ball",10,29],["🗿","Statuette",6,20],
    ["🔑","Vault key",3,12]]}
];

let li = 0, picked = new Set(), score = 0, stars = 0, streak = 0, hintUsed = false;
const $ = id => document.getElementById(id);

function solve(items, cap){
  const n = items.length;
  const dp = Array.from({length:n+1}, () => new Int32Array(cap+1));
  for(let i=1;i<=n;i++){
    const w = items[i-1][2], v = items[i-1][3];
    for(let c=0;c<=cap;c++){
      dp[i][c] = dp[i-1][c];
      if(w<=c) dp[i][c] = Math.max(dp[i][c], dp[i-1][c-w]+v);
    }
  }
  let c = cap, take = [];
  for(let i=n;i>0;i--){
    if(dp[i][c] !== dp[i-1][c]){ take.push(i-1); c -= items[i-1][2]; }
  }
  return { best: dp[n][cap], take: take.reverse() };
}

function render(){
  const L = LEVELS[li];
  $("level-no").textContent = "Level " + String(li+1).padStart(2,"0");
  $("level-title").textContent = L.name;
  $("level-blurb").textContent = L.blurb;
  $("s-level").textContent = li+1;
  $("cap-read").textContent = `/ ${L.cap} kg`;

  $("items").innerHTML = L.items.map((it,i)=>`
    <div class="item${picked.has(i)?" picked":""}" data-i="${i}">
      <div class="top"><span class="emoji">${it[0]}</span><span class="dot"></span></div>
      <div class="name">${it[1]}</div>
      <div class="meta"><span><em>${it[2]}</em> kg</span><span><em>${it[3]}</em> value</span></div>
    </div>`).join("");

  document.querySelectorAll(".item").forEach(el =>
    el.onclick = () => toggle(+el.dataset.i));

  update();
}

function toggle(i){
  picked.has(i) ? picked.delete(i) : picked.add(i);
  update();
}

function totals(){
  const L = LEVELS[li];
  let w=0, v=0;
  picked.forEach(i => { w += L.items[i][2]; v += L.items[i][3]; });
  return {w,v};
}

function update(){
  const L = LEVELS[li], {w,v} = totals();
  $("w-read").textContent = w;
  $("v-read").textContent = v;
  $("fill").style.width = Math.min(100, w/L.cap*100) + "%";
  $("fill").classList.toggle("over", w > L.cap);

  const note = $("note");
  note.classList.toggle("warn", w > L.cap);
  note.textContent = w > L.cap ? `Over by ${w-L.cap} kg` : (picked.size ? `${L.cap-w} kg remaining` : "");
  $("go").disabled = w > L.cap || picked.size === 0;

  $("bag").innerHTML = picked.size
    ? `<ul>${[...picked].map(i =>
        `<li data-i="${i}">${L.items[i][1]}<span>${L.items[i][2]} kg &nbsp;·&nbsp; ${L.items[i][3]}</span></li>`).join("")}</ul>`
    : `<p class="empty">Select items to pack them.</p>`;
  document.querySelectorAll(".bag li").forEach(el =>
    el.onclick = () => toggle(+el.dataset.i));

  document.querySelectorAll(".item").forEach(el =>
    el.classList.toggle("picked", picked.has(+el.dataset.i)));
}

function log(msg){
  const d = document.createElement("div");
  d.innerHTML = msg;
  $("log").prepend(d);
}

$("clear").onclick = () => { picked.clear(); update(); };

$("hint").onclick = () => {
  const L = LEVELS[li], {take} = solve(L.items, L.cap);
  const item = L.items[take[0]];
  score = Math.max(0, score - 20);
  hintUsed = true;
  $("s-score").textContent = score;
  $("hint").disabled = true;
  log(`Hint — the optimal bag includes <b>${item[1]}</b>.`);
};

$("go").onclick = () => {
  const L = LEVELS[li], {w,v} = totals();
  const {best, take} = solve(L.items, L.cap);
  const ratio = v / best;

  let st = 0;
  if(ratio >= 1) st = 3;
  else if(ratio >= 0.9) st = 2;
  else if(ratio >= 0.75) st = 1;

  let gained = Math.round(v * (1 + st*0.25));
  if(st === 3 && !hintUsed){ streak++; gained += streak * 10; }
  else streak = 0;

  score += gained; stars += st;
  $("s-score").textContent = score;
  $("s-stars").textContent = stars;
  $("s-streak").textContent = streak;

  $("m-title").textContent = st===3 ? "Optimal" : st===2 ? "Nearly there" : st===1 ? "Workable" : "Missed it";
  $("m-stars").innerHTML = "●".repeat(st) + "<i>" + "●".repeat(3-st) + "</i>";
  $("m-line").innerHTML = `You carried <b>${v}</b> value in <b>${w} of ${L.cap} kg</b>. The optimal bag is worth <b>${best}</b>. Earned <b>+${gained}</b> points${streak>1?` · streak ${streak}`:""}.`;
  $("m-sol").innerHTML = take.map(i =>
    `<b>${L.items[i][1]}</b> — ${L.items[i][2]} kg, ${L.items[i][3]} value`).join("<br>");

  $("m-next").textContent = li === LEVELS.length-1 ? "Final score" : "Next level";
  $("veil").classList.add("on");
  log(`Level ${li+1} — <b>${v}</b> of ${best} · ${st}/3 · +${gained}`);
};

$("m-next").onclick = () => {
  $("veil").classList.remove("on");
  if(li === LEVELS.length-1){
    const max = 3 * LEVELS.length;
    $("m-title").textContent = "Run complete";
    $("m-stars").innerHTML = `${stars} / ${max} stars`;
    $("m-line").innerHTML = `Final score <b>${score}</b>. ${stars===max?"Every level solved optimally.":"Replay to chase a perfect run."}`;
    $("m-sol").innerHTML = `Each level is a 0/1 knapsack: every item is either in or out, and the best bag is found with dynamic programming over item and remaining capacity. Greedy value-per-kilo usually gets close, but not always.`;
    document.querySelector(".sol .eyebrow").textContent = "How it works";
    $("m-next").textContent = "Play again";
    $("m-next").onclick = () => location.reload();
    $("veil").classList.add("on");
    return;
  }
  li++; picked.clear(); hintUsed = false;
  $("hint").disabled = false;
  render();
};

render();
</script>
</body>
</html>
